name: CaramOS 2.0 — Rust Workspace CI & Hybrid ISO Pipeline (Debian 13 Trixie)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Guard — Reject Tracked Binaries & Build Artifacts in Git
        run: |
          set -euo pipefail
          BAD_FILES="$(git ls-files | grep -E '(^|/)target/|^(build|build_dryrun)/|\.iso$|\.iso\.sha256$|\.squashfs$|^config/includes\.chroot/usr/local/bin/caramos-' || true)"
          if [ -n "$BAD_FILES" ]; then
            echo "✖ Phát hiện tệp nhị phân/build artifact đang bị theo dõi trong Git:"
            echo "$BAD_FILES"
            exit 1
          fi
          echo "✔ Cây Git sạch, không chứa target/ hay binary biên dịch."

      - name: Install Host ISO & GTK4/Libadwaita Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev \
            libadwaita-1-dev \
            pkg-config \
            mmdebstrap \
            debian-archive-keyring \
            squashfs-tools \
            xorriso \
            grub-efi-amd64-bin \
            grub-pc-bin \
            grub-common \
            mtools \
            dosfstools \
            ca-certificates

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo Dependencies & Workspace Target
        uses: Swatinem/rust-cache@v2

      - name: Enforce Zero-Panic & Zero-Warning Policy (Workspace Clippy)
        run: |
          cargo clippy --workspace --all-targets -- \
            -D warnings \
            -D clippy::unwrap_used \
            -D clippy::expect_used \
            -D clippy::panic

      - name: Run Workspace Unit & Integration Tests
        run: cargo test --workspace --verbose

      - name: Build All 4 Release Binaries (ctl, ui, app-center, driver-check)
        run: cargo build --workspace --release

      - name: Stage GRUB2, Plymouth, Calamares & Desktop Autostart Overlay (Isolated in ./build/ui_overlay)
        run: |
          set -euo pipefail
          ./target/release/caramos-ui branding \
            --output-root ./build/ui_overlay \
            --wallpaper-search-dir ./config/includes.chroot/usr/share/backgrounds \
            --assets-dir ./assets \
            --width 1280 \
            --height 720
          test -f ./build/ui_overlay/boot/grub/themes/caramos/background.png
          test ! -f ./build/ui_overlay/boot/grub/themes/caramos/background.tga
          test -f ./build/ui_overlay/etc/calamares/branding/caramos/branding.desc
          test -f ./build/ui_overlay/etc/calamares/branding/caramos/show.qml
          test -f ./build/ui_overlay/etc/calamares/modules/users.conf
          test -f ./build/ui_overlay/usr/share/applications/caramos-app-center.desktop
          test -f ./build/ui_overlay/etc/xdg/autostart/caramos-app-center.desktop
          test -f ./build/ui_overlay/usr/share/applications/caramos-driver-check.desktop
          test -f ./build/ui_overlay/etc/xdg/autostart/caramos-driver-check.desktop

      - name: Guard — Ensure Repository Working Tree Remains Clean
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "✖ Quá trình stage đã làm bẩn cây mã nguồn Git:"
            git status --short
            exit 1
          fi
          echo "✔ config/includes.chroot/ và toàn bộ cây Git hoàn toàn nguyên vẹn."

      - name: Verify End-to-End Dry-Run Pipeline & 4 Binary Staging
        run: |
          set -euo pipefail
          mkdir -p ./build_dryrun/rootfs/etc/calamares
          printf 'branding: debian\n' > ./build_dryrun/rootfs/etc/calamares/settings.conf

          ./target/release/caramos-ctl build \
            --dry-run \
            --work-dir ./build_dryrun \
            --extra-overlay ./build/ui_overlay \
            --stage-bin ./target/release/caramos-ctl \
            --stage-bin ./target/release/caramos-ui \
            --stage-bin ./target/release/caramos-app-center \
            --stage-bin ./target/release/caramos-driver-check

          grep -q '^branding: caramos$' ./build_dryrun/rootfs/etc/calamares/settings.conf
          test -x ./build_dryrun/rootfs/usr/local/bin/caramos-ctl
          test -x ./build_dryrun/rootfs/usr/local/bin/caramos-ui
          test -x ./build_dryrun/rootfs/usr/local/bin/caramos-app-center
          test -x ./build_dryrun/rootfs/usr/local/bin/caramos-driver-check
          test -f ./build_dryrun/CaramOS-2.0.0-debian-trixie-amd64.iso

      - name: Free Disk Space on Runner Before Live ISO Build
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/share/swift || true
          df -h

      - name: Build Full Bootable Debian 13 (Trixie) Hybrid UEFI/BIOS Live ISO
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sudo env "GITHUB_TOKEN=${GITHUB_TOKEN:-}" ./target/release/caramos-ctl build \
            --work-dir /tmp/caramos-build \
            --output-iso ./build/CaramOS-2.0.0-debian-trixie-amd64.iso \
            --extra-overlay ./build/ui_overlay \
            --stage-bin ./target/release/caramos-ctl \
            --stage-bin ./target/release/caramos-ui \
            --stage-bin ./target/release/caramos-app-center \
            --stage-bin ./target/release/caramos-driver-check

      - name: Verify Hybrid BIOS + UEFI Boot Catalog Inside Generated ISO
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          set -euo pipefail
          ISO_PATH="build/CaramOS-2.0.0-debian-trixie-amd64.iso"
          test -s "$ISO_PATH"
          test -s "${ISO_PATH}.sha256"
          (cd build && sha256sum -c "CaramOS-2.0.0-debian-trixie-amd64.iso.sha256")
          xorriso -indev "$ISO_PATH" -report_el_torito plain -report_system_area plain | tee build/iso_boot_report.txt
          grep -qi "El Torito" build/iso_boot_report.txt
          grep -qi "efi" build/iso_boot_report.txt
          echo "✔ Xác thực thành công ảnh Hybrid BIOS + UEFI ISO."

      - name: Upload Official Hybrid ISO & SHA-256 Artifact
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: CaramOS-2.0-debian-trixie-amd64-ISO
          if-no-files-found: error
          path: |
            build/CaramOS-*.iso
            build/CaramOS-*.iso.sha256
          retention-days: 14
