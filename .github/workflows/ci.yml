name: CaramOS 2.0 Rust CI & ISO Build

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      build_iso:
        description: "Dựng ảnh ISO Debian 13 thật và tải lên Artifact để test QEMU"
        required: false
        default: true
        type: boolean
      commit_legacy_cleanup:
        description: "Tự động git rm các file di sản Mint/Ubiquity/Python còn sót và commit"
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  verify-rust-workspace:
    name: Auto-Format, Clippy, Test, Legacy Cleanup & Dry-Run
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install GTK4 & libadwaita Development Headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libgtk-4-dev libadwaita-1-dev

      - uses: Swatinem/rust-cache@v2

      - name: Auto-Format Rust Workspace (cargo fmt)
        run: |
          set -euo pipefail
          cargo fmt --all
          if ! git diff --quiet -- '*.rs'; then
            if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add -u -- '*.rs'
              if ! git diff --cached --quiet; then
                git commit -m "style: auto-format Rust code with rustfmt"
                git push origin "HEAD:${GITHUB_REF_NAME}"
              fi
            else
              git diff --stat -- '*.rs'
            fi
          fi

      - name: Enforce Strict Clippy Lints (Zero Panic / Zero Unsafe)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Full Unit & Integration Test Suite
        run: cargo test --workspace --verbose

      - name: Build Release Binaries (5 Rust Binaries)
        run: cargo build --workspace --release

      - name: Upload Release Binaries for ISO Job
        uses: actions/upload-artifact@v4
        with:
          name: caramos-rust-binaries
          path: |
            target/release/caramos-ctl
            target/release/caramos-ui
            target/release/caramos-app-center
            target/release/caramos-driver-check
            target/release/caramos-update-center
          retention-days: 1

      - name: Guard — Reject Tracked Binaries & Build Artifacts in Git
        run: |
          set -euo pipefail
          BAD=$(git ls-files | grep -E '(^target/|^work/|(^|/)[^/]+\.(iso|squashfs|img|deb)$)' || true)
          if [ -n "$BAD" ]; then
            echo "::error::Phát hiện file nhị phân/artifact cấm trong Git:"
            echo "$BAD"
            exit 1
          fi

      - name: Cleanup Workspace & Verify Branding + Dry-Run
        run: |
          set -euo pipefail
          ./target/release/caramos-ctl prune --repo-root . --execute || true
          mkdir -p /tmp/caramos-ci-branding /tmp/caramos-ci-work
          ./target/release/caramos-ui branding \
            --output-root /tmp/caramos-ci-branding \
            --wallpaper-dir config/includes.chroot/usr/share/backgrounds \
            --assets-dir assets --width 1280 --height 720
          test -f /tmp/caramos-ci-branding/boot/grub/themes/caramos/background.png
          test -f /tmp/caramos-ci-branding/etc/calamares/branding/caramos/branding.desc
          test -f /tmp/caramos-ci-branding/usr/share/applications/caramos-app-center.desktop
          test -f /tmp/caramos-ci-branding/usr/share/applications/caramos-app-center-link.desktop
          test -f /tmp/caramos-ci-branding/usr/share/applications/caramos-driver-check.desktop
          ./target/release/caramos-ctl build \
            --arch amd64 --work-dir /tmp/caramos-ci-work \
            --includes-dir config/includes.chroot \
            --extra-overlay /tmp/caramos-ci-branding \
            --stage-bin ./target/release/caramos-ctl \
            --stage-bin ./target/release/caramos-ui \
            --stage-bin ./target/release/caramos-app-center \
            --stage-bin ./target/release/caramos-driver-check \
            --stage-bin ./target/release/caramos-update-center \
            --packages-file config/packages.txt \
            --output-iso /tmp/caramos-ci-work/CaramOS-2.0.0-debian-trixie-amd64.iso \
            --dry-run

  build-debian-iso:
    name: Build Bootable Debian 13 ISO (QEMU Test Artifact)
    needs: verify-rust-workspace
    if: >
      (github.event_name == 'workflow_dispatch' && inputs.build_iso == true) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'style: auto-format'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free Runner Disk Space (~25 GB for mmdebstrap + squashfs)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/.ghcup
          df -h

      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/download-artifact@v4
        with:
          name: caramos-rust-binaries
          path: target/release

      - run: chmod +x target/release/caramos-*

      - name: Install ISO Build Dependencies & Debian 13 Trixie GPG Keyring
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mmdebstrap debian-archive-keyring gnupg squashfs-tools xorriso mtools dosfstools \
            grub-common grub2-common grub-pc-bin grub-efi-amd64-bin \
            ca-certificates curl unzip xz-utils

          rm -f /tmp/debian-trixie-keys.asc /tmp/debian-trixie-keyring.gpg
          for key in archive-key-12.asc archive-key-13.asc archive-key-13-security.asc release-12.asc release-13.asc; do
            curl -fsSL "https://ftp-master.debian.org/keys/${key}" >> /tmp/debian-trixie-keys.asc
            echo "" >> /tmp/debian-trixie-keys.asc
          done
          gpg --batch --yes --dearmor -o /tmp/debian-trixie-keyring.gpg /tmp/debian-trixie-keys.asc
          chmod 644 /tmp/debian-trixie-keyring.gpg
          gpg --show-keys /tmp/debian-trixie-keyring.gpg

      - name: Prune Legacy Workspace Files & Stage Branding Overlay
        run: |
          set -euo pipefail
          ./target/release/caramos-ctl prune --repo-root . --execute || true
          mkdir -p work/branding work/iso-out
          ./target/release/caramos-ui branding \
            --output-root work/branding \
            --wallpaper-dir config/includes.chroot/usr/share/backgrounds \
            --assets-dir assets --width 1920 --height 1080

      - name: Build Full Hybrid BIOS+UEFI CaramOS 2.0 ISO (Debian 13 Trixie)
        run: |
          set -euo pipefail
          ISO_PATH="work/iso-out/CaramOS-2.0.0-debian-trixie-amd64.iso"
          sudo ./target/release/caramos-ctl build \
            --arch amd64 \
            --suite trixie \
            --keyring /tmp/debian-trixie-keyring.gpg \
            --work-dir work/build \
            --includes-dir config/includes.chroot \
            --extra-overlay work/branding \
            --stage-bin ./target/release/caramos-ctl \
            --stage-bin ./target/release/caramos-ui \
            --stage-bin ./target/release/caramos-app-center \
            --stage-bin ./target/release/caramos-driver-check \
            --stage-bin ./target/release/caramos-update-center \
            --packages-file config/packages.txt \
            --output-iso "$ISO_PATH"
          sudo chown -R "$(id -u):$(id -g)" work/iso-out
          (cd work/iso-out && sha256sum CaramOS-2.0.0-debian-trixie-amd64.iso > CaramOS-2.0.0-debian-trixie-amd64.iso.sha256)
          ls -lh work/iso-out
          xorriso -indev "$ISO_PATH" -report_el_torito plain

      - name: Upload CaramOS ISO & SHA256 Artifact for QEMU Testing
        uses: actions/upload-artifact@v4
        with:
          name: CaramOS-2.0.0-debian-trixie-amd64-iso
          path: |
            work/iso-out/CaramOS-2.0.0-debian-trixie-amd64.iso
            work/iso-out/CaramOS-2.0.0-debian-trixie-amd64.iso.sha256
          retention-days: 7

  cleanup-legacy-repo:
    name: Auto-Commit Legacy File Removal (Manual Dispatch)
    if: github.event_name == 'workflow_dispatch' && inputs.commit_legacy_cleanup == true
    needs: verify-rust-workspace
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove Legacy Files from Git
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rf --ignore-unmatch \
            .gitmodules caramos_vietnam_banner.png \
            packages/caramos-app-center packages/caram-os-demo \
            config/archives/linuxmint.key.binary config/archives/linuxmint.key.chroot config/archives/linuxmint.pref.chroot \
            config/includes.chroot/etc/skel/.linuxmint \
            config/includes.chroot/usr/share/applications/ubiquity.desktop \
            config/includes.chroot/etc/os-release || true
          BG_DIR="config/includes.chroot/usr/share/backgrounds/caramos"
          if [ -d "$BG_DIR" ]; then
            git rm -f --ignore-unmatch \
              "$BG_DIR"/animation-*.png "$BG_DIR"/throbber-*.png "$BG_DIR"/plymouth-logo.png \
              "$BG_DIR"/bullet.png "$BG_DIR"/entry.png "$BG_DIR"/lock.png "$BG_DIR"/splash.png || true
          fi
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove legacy Mint/Ubiquity/Python submodule and duplicate Plymouth assets"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
